<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Requests — Campus Skill Exchange</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/requests.css">
</head>
<body>
<div class="app-shell">

  <div class="sidebar-overlay"></div>
  <aside class="sidebar">
    <a href="index.html" class="sidebar-brand">
      <svg class="swap-mark" width="30" height="30" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,.1)"/>
        <path d="M12 16.5h12.5l-3.2-3.2M28 23.5H15.5l3.2 3.2" stroke="#8FB0F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Skill Exchange
    </a>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Main</span>
      <a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>Dashboard</a>
      <a href="browse-skills.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Browse Skills</a>
      <a href="skill-management.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 5-9 5-9-5 9-5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>My Skills</a>
      <a href="requests.html" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 8v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8m18 0-8.6 5.2a2 2 0 0 1-2.1 0L3 8m18 0-2-3H5L3 8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Learning Requests<span class="nav-badge">3</span></a>
      <a href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>My Profile</a>
      <span class="sidebar-section-label">Administration</span>
      <a href="admin.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Admin Dashboard</a>
    </nav>
    <div class="sidebar-user">
      <div class="avatar" id="sidebarAvatar">--</div>
      <div><div class="u-name" id="sidebarUserName">Loading…</div><div class="u-role" id="sidebarUserRole"></div></div>
      <a href="login.html" class="logout" title="Log out" aria-label="Log out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" aria-label="Toggle sidebar"><span></span><span></span><span></span></button>
        <div class="topbar-title"><h1>Learning Requests</h1><p class="text-muted">Track requests you've sent and received.</p></div>
      </div>
      <div class="topbar-right">
        <button class="icon-bell" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 8a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 20a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6"/></svg><span class="dot"></span></button>
        <div class="avatar" id="topbarAvatar" style="width:38px;height:38px;font-size:.8rem">--</div>
      </div>
    </header>

    <main class="app-content">

      <div class="tabs mb-24">
        <button class="tab-btn active" data-tab="pending">Pending <span class="tab-count" id="countPending">0</span></button>
        <button class="tab-btn" data-tab="accepted">Accepted <span class="tab-count" id="countAccepted">0</span></button>
        <button class="tab-btn" data-tab="rejected">Rejected <span class="tab-count" id="countRejected">0</span></button>
        <button class="tab-btn" data-tab="history">Request History</button>
      </div>

      <!-- Pending -->
      <div class="tab-panel active" id="tab-pending">
        <div class="req-list" id="pendingList"></div>
      </div>

      <!-- Accepted -->
      <div class="tab-panel" id="tab-accepted">
        <div class="req-list" id="acceptedList"></div>
      </div>

      <!-- Rejected -->
      <div class="tab-panel" id="tab-rejected">
        <div class="req-list" id="rejectedList"></div>
      </div>

      <!-- History -->
      <div class="tab-panel" id="tab-history">
        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Skill</th><th>With</th><th>Type</th><th>Status</th><th>Date</th></tr></thead>
              <tbody id="historyBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script src="js/current-user.js"></script>
<script src="js/requests.js"></script>
</body>
</html>
